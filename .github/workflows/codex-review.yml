# Codex code review (owner, 2026-10-09; replaces the ChatGPT plugin). Modelled
# on the backend's workflow (edufurtherbe #395).
#
# Runs on its own when a pull request is opened, reopened or marked ready for
# review. Re-review after pushing fixes by commenting `/codex-review`: that run
# covers only the commits since the last review. Pushes do not re-run it on
# their own, which is the main cost control. The diff leaves out lock files,
# docs, generated code and binaries, and an oversized diff is refused rather
# than reviewed.
#
# Two jobs, so the one holding the API key can read the code and nothing else,
# and only the small posting job can write to the pull request.

name: Codex review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  # The PR's changed lines (added + removed, after the exclusions below), not a
  # file's size. Over this, the review is refused with a note to split the PR.
  MAX_DIFF_LINES: "3000"
  # Codex's own run is capped here (owner, 2026-10-09). A review that runs over
  # says so on the PR instead of going quiet.
  CODEX_MINUTES: "5"

jobs:
  review:
    # Automatically on a pull request that is not a draft and not Dependabot's
    # (it gets no secrets). Or on request: a comment starting `/codex-review`
    # from someone who can write to the repository, because issue_comment runs
    # hold secrets and a passer-by must not be able to spend the key.
    if: >-
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/codex-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Room for the checkout and the diff around Codex's own 5 minutes.
    timeout-minutes: 8
    # On the job, not the workflow: every comment on a pull request starts a
    # run of this workflow, and a workflow-level group would let an unrelated
    # comment cancel a review in progress. Only a newer /codex-review replaces
    # an older one.
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.prepare.outputs.verdict }}
      head: ${{ steps.pr.outputs.head }}
      scope: ${{ steps.prepare.outputs.scope }}
      lines: ${{ steps.prepare.outputs.lines }}
      codex: ${{ steps.codex.outcome }}
      result: ${{ steps.codex.outputs.final-message }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"head=\(.head.sha)\nbase=\(.base.sha)\nbase_ref=\(.base.ref)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - name: Prepare the diff
        id: prepare
        env:
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          mkdir -p codex-review

          # No key, no review: decided first, so an unconfigured repo spends
          # nothing and still says why.
          if [ "$HAS_KEY" != "true" ]; then
            echo "verdict=no-key" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The prompt comes from the base branch, never from the pull request,
          # so a change cannot rewrite its own reviewer's instructions. Absent
          # there (the PR that introduces it), the review is skipped rather than
          # run on the PR's own copy.
          git fetch --quiet origin "$BASE_REF"
          if ! git show "origin/$BASE_REF:.github/codex/prompts/review.md" > codex-review/prompt.md 2>/dev/null; then
            echo "verdict=no-prompt" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only what changed since the last review this workflow posted, when
          # that commit is still in the branch's history; otherwise the whole PR.
          reviews=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          last=$(printf '%s\n' "$reviews" | grep -o 'codex-review:head=[0-9a-f]\{40\}' | tail -1 | cut -d= -f2 || true)
          if [ -n "$last" ] && git merge-base --is-ancestor "$last" "$HEAD" 2>/dev/null; then
            from="$last"
            echo "scope=commits since the last review (${last:0:7})" >> "$GITHUB_OUTPUT"
            echo "Partial: only the commits since ${last} are in pr.diff." > codex-review/range.txt
          else
            from=$(git merge-base "$BASE" "$HEAD")
            echo "scope=the whole pull request" >> "$GITHUB_OUTPUT"
            echo "Whole pull request." > codex-review/range.txt
          fi

          # Left out: lock files, docs and markdown, the agents' own docs, this
          # reviewer's prompt, generated API types, build output, snapshots and
          # binaries (fonts, images). None of them is reviewed by reading.
          git diff "$from" "$HEAD" -- . \
            ':(exclude)pnpm-lock.yaml' ':(exclude)package-lock.json' \
            ':(exclude)docs/**' ':(exclude)**/*.md' ':(exclude).claude/**' \
            ':(exclude).github/codex/**' ':(exclude)src/lib/api/generated/**' \
            ':(exclude)openapi/**' ':(exclude)dist/**' ':(exclude)build/**' \
            ':(exclude).next/**' ':(exclude)**/__snapshots__/**' ':(exclude)**/*.snap' \
            ':(exclude)**/*.woff2' ':(exclude)**/*.png' ':(exclude)**/*.jpg' \
            ':(exclude)**/*.webp' > codex-review/pr.diff

          # Findings raised on this PR and the replies to them, so a finding
          # already fixed or answered as wrong is not raised again. Every
          # comment, not only the reviewer's: the answer is the author's reply.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | "--- \(.user.login):\n\(.body)\n"' | tail -c 20000 > codex-review/answered.md

          lines=$(wc -l < codex-review/pr.diff)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          if [ "$lines" -eq 0 ]; then
            echo "verdict=empty" >> "$GITHUB_OUTPUT"
          elif [ "$lines" -gt "$MAX_DIFF_LINES" ]; then
            echo "verdict=too-large" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=review" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex
        id: codex
        if: steps.prepare.outputs.verdict == 'review'
        # The cap is on this step, and the job carries on past it, so the
        # posting job can say the review ran out of time.
        timeout-minutes: 5
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-review/prompt.md
          effort: high
          sandbox: read-only
          safety-strategy: drop-sudo

  post:
    needs: review
    # Not when a newer /codex-review replaced this run: that run posts instead.
    if: always() && needs.review.result != 'skipped' && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      OUTCOME: ${{ needs.review.result }}
      VERDICT: ${{ needs.review.outputs.verdict }}
      CODEX: ${{ needs.review.outputs.codex }}
      HEAD: ${{ needs.review.outputs.head }}
      SCOPE: ${{ needs.review.outputs.scope }}
      LINES: ${{ needs.review.outputs.lines }}
      RESULT: ${{ needs.review.outputs.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the pull request
        run: |
          {
            if [ "$OUTCOME" != "success" ]; then
              echo "**Codex review did not complete** ($OUTCOME). [Run log]($RUN_URL)"
            elif [ "$VERDICT" = "no-prompt" ]; then
              echo "**Codex review skipped:** the review prompt is not on the base branch yet. It runs from the next PR after this one merges."
            elif [ "$VERDICT" = "no-key" ]; then
              echo "**Codex review skipped:** the \`OPENAI_API_KEY\` repository secret is not set."
            elif [ "$VERDICT" = "empty" ]; then
              echo "**Codex review:** nothing to review in $SCOPE."
            elif [ "$VERDICT" = "too-large" ]; then
              echo "**Codex review skipped:** $LINES changed lines in $SCOPE, over the $MAX_DIFF_LINES-line limit. Split the PR, or raise \`MAX_DIFF_LINES\` deliberately."
            elif [ "$CODEX" != "success" ]; then
              echo "**Codex review didn't finish** within $CODEX_MINUTES minutes, or failed ($CODEX). [Run log]($RUN_URL). Comment \`/codex-review\` to retry, or split the PR."
            else
              echo "**Codex review** of $SCOPE (\`${HEAD:0:7}\`, effort high)"
              echo
              printf '%s\n' "$RESULT"
              # Marks the commit reviewed, so the next /codex-review covers only
              # what comes after it. Only written when a review actually ran.
              echo
              echo "<!-- codex-review:head=$HEAD -->"
            fi
          } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
