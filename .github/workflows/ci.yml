# Frontend standards CI.
#
# EDIT THIS FILE. It assumes pnpm and a `gen:api` script. Match your package
# manager and your script names, and set the coverage threshold to your CURRENT
# coverage rather than an aspiration — a gate that fails on day one for something
# nobody in that PR caused gets deleted within a week.
#
# This file is tier 2: an update stages ci.yml.new beside it rather than
# overwriting your version.
#
# Layout (owner, 2026-11-11: same checks and thresholds, less waiting). The
# slow parts run side by side instead of one after another:
#   changes      docs-only PR?  (then the heavy jobs skip)
#   checks       copy, icons, private paths, spec + client, types, lint,
#                boundaries, build, bundle secrets
#   test ×3      the suite in shards, each recording coverage
#   coverage     merges the shards and applies the coverage thresholds once,
#                to the whole suite (vitest.config.ts)
#   size         over the code reviewer's line limit? (fails in seconds)
#   verify       the required check: green only if size, checks and coverage are
#   page-review  the built app with Playwright, in parallel with the rest

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TEST_SHARDS: 3

permissions:
  contents: read

jobs:
  # A PR that only touches docs needs no build, tests or browser run. Main
  # always runs everything. Anything that isn't plainly a doc counts as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|.claude/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  # The GitHub code reviewer skips a PR over its line limit: say so in seconds,
  # before anyone waits for a review that won't run. Promotions
  # (development → main) are exempt: they bundle PRs already reviewed.
  size:
    if: github.event_name == 'pull_request' && github.head_ref != 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reviewable size
        run: node scripts/review-size.mjs "origin/${{ github.base_ref }}" HEAD

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; the action refuses two sources.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # This repo is public: the API spec, the generated client and handoff docs
      # must never be tracked (scripts/check-private-paths.mjs).
      - name: Private paths are not tracked
        run: node scripts/check-private-paths.mjs

      # The icon font is committed (no Google Fonts at build or runtime): it must
      # hold exactly the glyphs iconNames.ts lists (pnpm icons:pull regenerates it).
      - name: Icon font matches iconNames.ts
        run: pnpm check:icons

      # Hard rule 1 of the ux-writer spec: no em dash in a string a user reads.
      # Cheap and early, before the spec pull and the build.
      - name: No em dashes in product copy
        run: pnpm check:copy

      # The spec comes from the backend: its CI publishes openapi.json on every
      # merge to main (release "openapi-latest"; the backend repo is public, so no
      # token, no secret; fork PRs run the same as ours).
      - name: Pull the API spec from the backend
        run: pnpm spec:pull

      - name: Generate API client
        run: pnpm gen:api

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The mechanical half of the standards. Exit 2 means misconfigured, which is
      # also a failure — a checker scanning zero files reports green while
      # enforcing nothing.
      - name: Boundaries
        run: node scripts/check-boundaries.mjs

      # Next's incremental build cache: a warm build reuses unchanged work.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # Secrets do not belong in a client bundle, and removing the variable later
      # does not un-publish the old build. Add your own patterns.
      - name: Grep the bundle for secrets
        run: |
          set -euo pipefail
          PATTERNS='sk_live_|sk_test_|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}'
          DIRS=$(ls -d .next/static dist build out 2>/dev/null || true)
          if [ -z "$DIRS" ]; then echo "no build output found to scan"; exit 0; fi
          if grep -rIEl "$PATTERNS" $DIRS; then
            echo "A secret pattern is present in the build output. Rotate it."
            exit 1
          fi
          echo "clean"

  # The suite in parallel shards. Each records coverage into a blob; no
  # thresholds here (VITEST_SHARD), so no shard can pass or fail on its own share.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests compile against the same generated client the app builds with.
      - name: Pull the API spec and generate the client
        run: |
          pnpm spec:pull
          pnpm gen:api
      - name: Test (shard ${{ matrix.shard }} of ${{ env.TEST_SHARDS }})
        env:
          VITEST_SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }} --reporter=blob --reporter=default
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # One coverage report for the whole suite, with the thresholds in
  # vitest.config.ts applied to it (never lowered to go green).
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true
      - name: Merge the shards and check coverage
        run: pnpm exec vitest --merge-reports --coverage

  # The required status check. One name for branch protection, green only when
  # every gate it stands for passed (or was skipped for a docs-only PR).
  verify:
    needs: [changes, size, checks, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gates passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SIZE: ${{ needs.size.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE checks=$CHECKS coverage=$COVERAGE"
          [ "$CHANGES" = "success" ] || { echo "change detection failed"; exit 1; }
          case "$SIZE" in success|skipped) ;; *) echo "too large for the code reviewer: split the PR"; exit 1 ;; esac
          if [ "$CODE" = "true" ]; then
            [ "$CHECKS" = "success" ] || { echo "checks: $CHECKS"; exit 1; }
            [ "$COVERAGE" = "success" ] || { echo "tests or coverage: $COVERAGE"; exit 1; }
          fi
          echo "all gates passed"

  page-review:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager"; the action refuses two sources.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser binary is cached by Playwright's version; the system
      # libraries it needs are installed every run (they live outside the cache).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Both go through Ubuntu's apt mirrors, which do have outages (11 Nov: DNS
      # failures hung this step 10 minutes). A time limit and one retry: a
      # blip passes, an outage fails in minutes and says so.
      - name: Install the browser and its system libraries
        timeout-minutes: 8
        env:
          CACHED: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHED" = "true" ]; then cmd="install-deps"; else cmd="install --with-deps"; fi
          for attempt in 1 2; do
            if timeout 180 pnpm exec playwright $cmd chromium; then exit 0; fi
            echo "playwright $cmd failed (attempt $attempt); Ubuntu mirrors may be down"
            sleep 15
          done
          exit 1

      # Same spec as checks; the build needs the client.
      - name: Pull the API spec and generate the client
        run: |
          pnpm spec:pull
          pnpm gen:api

      # Its own build cache: this build talks to the mock API (other env vars).
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-mock-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-mock-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Review a BUILT app. Dev-server numbers are not the numbers you ship.
      # Phase A: no backend in CI, so the build talks to the in-app mock API.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/mock
          NEXT_PUBLIC_MOCK_VIEWER: mentee
      - run: pnpm start &
        env:
          ENABLE_MOCK_API: "1"
      - name: Wait for the server
        # "/" has no page until the Home screen ships; wait on a real route.
        run: npx --yes wait-on http://localhost:3000/explore --timeout 60000

      # List the routes that must stay clean. Add to this as you go; a route not
      # listed here is a route nobody is measuring.
      - name: Review pages
        run: |
          set -e
          # /mentors/olajuwon-samuel: a full mock profile (Mentor Profile PR 1).
          # /session-types: mentor-only; the mock viewer is the mentor there (viewer.ts).
          # /session-types/new?template=sop-review: the create wizard, pre-filled.
          # /invite/…?mockViewer=guest: the invite landing, a valid and a broken link;
          # /invite/tunde-9q4z: the mock mentee on someone else's link (existing-account card).
          for route in /explore /mentors/olajuwon-samuel /session-types "/session-types/new?template=sop-review" "/invite/damilola-7k2x?mockViewer=guest" "/invite/gone-0000?mockViewer=guest" /invite/tunde-9q4z ; do
            node scripts/review-page.mjs "$route"
          done

      # Layout invariants at in-between widths the screenshots skip
      # (failure-modes #26). Add a check when one of those bites.
      - name: Check layout
        # Runs even when Review pages failed, so one push shows both.
        if: ${{ !cancelled() }}
        run: node scripts/check-layout.mjs

      # A failed run whose screenshots you cannot see is a puzzle.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-review
          path: .review/
          retention-days: 7
