<!-- next/font only runs in the app's root layout. Storybook declares the same
     self-hosted files (src/app/fonts, served at /fonts by main.ts) and maps them
     onto the --ff-* variables that styles/tokens/fonts.css expects. No Google Fonts. -->
<style>
  @font-face { font-family: 'Hanken Grotesk'; src: url('/fonts/hanken-grotesk-var.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('/fonts/inter-var.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: 'Poppins'; src: url('/fonts/poppins-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Poppins'; src: url('/fonts/poppins-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Nunito Sans'; src: url('/fonts/nunito-sans-var.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: 'Material Symbols Outlined'; src: url('/fonts/material-symbols.woff2') format('woff2'); font-weight: 400; font-display: block; }
  :root {
    --ff-hanken: 'Hanken Grotesk';
    --ff-inter: 'Inter';

    --ff-icons: 'Material Symbols Outlined';

</style>
