<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · EduFurther</title>
    <!--
      Shown by the service worker (public/sw.js) when a page can't load
      because there is no connection. Static on purpose: precached at install,
      it holds nothing about anyone. System colours and fonts only, so it
      reads correctly in light and dark mode without the app's styles.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: Canvas;
        color: CanvasText;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0 0 8px;
      }
      p {
        font-size: 1rem;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        border: 2px solid CanvasText;
        background: CanvasText;
        color: Canvas;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>EduFurther needs a connection to open this page. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
